name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Typecheck (only packages with TS sources)
        run: npm run typecheck

      - name: Tests (only packages with a test script)
        run: npm test

      - name: Check internal doc links
        run: npm run lint:docs

      - name: Build docs site
        run: npm run docs:build